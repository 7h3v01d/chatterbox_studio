[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatterbox-studio"
version = "0.5.1"
description = "Clone your voice and use it anywhere: desktop app, CLI, REST, OpenAI-compatible and MCP."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Leon Priest" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "chatterbox-tts",
    "numpy",
    "soundfile>=0.12",
    "sounddevice",
    "librosa",
    "PyQt6",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "httpx",
    "mcp",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
chatterbox-studio = "chatterbox_studio.cli:main"

[project.urls]
Homepage = "https://github.com/7h3v01d/chatterbox_studio"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
